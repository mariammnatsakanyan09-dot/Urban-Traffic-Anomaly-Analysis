name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t traffic-monitor .

      - name: Import smoke test
        # Imports the FastAPI app inside the built image: verifies that all
        # dependencies are installed and that the model loads correctly.
        run: docker run --rm traffic-monitor python -c "import app; print('import OK')"
