<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Traffic Stream Test</title>
</head>
<body>
  <h2>Тест /detect_stream</h2>
  <input id="videoName" type="text" value="13708052_2160_3840_30fps.mp4" style="width: 300px;">
  <button onclick="startStream()">Старт</button>
  <div id="stats" style="margin: 10px 0; font-family: monospace;"></div>
  <img id="frame" style="max-width: 800px; border: 1px solid #ccc;">

  <script>
    function startStream() {
      const videoName = document.getElementById("videoName").value;
      const ws = new WebSocket("ws://localhost:8000/detect_stream");

      ws.onopen = () => ws.send(JSON.stringify({ video: videoName }));

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.error) {
          document.getElementById("stats").innerText = "Ошибка: " + data.error;
          return;
        }
        if (data.event === "end_of_stream") {
          document.getElementById("stats").innerText = "Видео закончилось";
          return;
        }
        document.getElementById("frame").src = "data:image/jpeg;base64," + data.frame;
        document.getElementById("stats").innerText = JSON.stringify(data.stats);
      };

      ws.onerror = (err) => console.error("WebSocket error:", err);
    }
  </script>
</body>
</html>
